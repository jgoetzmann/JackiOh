# CI for JackiOh — BUILD.md §5's Definition of done, in the order it lists them.
#
# The e2e job is the only awkward one, and the awkwardness is a rule rather than an accident:
# SPEC §11 R144 makes the server reseed its fixture accounts and invite codes **at boot**, so a
# suite that activates the pending account or spends an invite code is repeatable only against a
# fresh server. Spec 10 does both. So the server is restarted before each browser pass, and a
# retried spec-10 test cannot pass either — which is why `retries` is left at the Cypress config's
# value and not raised here to paper over a red run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Card data and rules only. No secret belongs in this file: SUPABASE_SECRET_KEY and CODE_PEPPER
  # are the two that must never be committed, which is why .gitignore carries `.env`.
  CATALOG_VERSION: core-1

jobs:
  checks:
    name: lint, typecheck, unit, fuzz, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck

      # BUILD §5 names these four by hand, so they run by hand rather than hiding inside `test`.
      - name: catalog data (100 cards, 9 tokens, rarity counts)
        run: pnpm validate:catalog
      - name: every card has a test file
        run: pnpm exec tsx packages/cards/scripts/missing-tests.ts
      - name: every SPEC §11 row has a named test
        run: pnpm rulings:coverage

      - name: unit and integration suites
        run: pnpm test

      # 1,000 seeds over the full card pool. Separate from `pnpm test`, which sweeps the same file
      # at a reduced seed count — the gate is this one.
      - name: fuzz gate
        run: pnpm fuzz

      # BUILD §5's 90% line floor. The threshold lives in vitest.config.ts; it is enforced here
      # rather than asserted in prose.
      - name: coverage floor
        run: pnpm test:coverage

  # The practice AI's quality gates at their full seed counts (docs/polish/3-ai.md B28–B31): the AI
  # on Easy against the random policy (100 games) and the greedy baseline (50), and the AI on Hard
  # against itself on Easy (50), every game folded back to its hash. `pnpm test` in `checks` runs
  # the same three files at a smoke size; the full run is minutes of search, so it gets its own job
  # and runs beside the others instead of after them.
  ai-gate:
    name: ai quality gates (full)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: the three matchups at their full seed counts
        run: pnpm ai:gate

  # BUILD M6-T3's acceptance names a **raw SQL test**: "the unique index rejects a duplicate across
  # decks even when the application check is bypassed". That test is CHECK 14 of
  # apps/server/test/sql/01_schema_invariants.sql, and until now nothing ran it — the whole file
  # executed only when a human typed the command. An acceptance item that never executes is the
  # limit case of this project's recurring defect, so it gets a gate.
  #
  # It is worth its own job rather than a step in `checks`: the vitest suites run against an
  # in-memory fake store, so nothing here overlaps them. RLS under the `authenticated` role, the
  # append-only triggers, the SECURITY DEFINER boundaries and the L4 index can only be measured
  # against a real Postgres.
  sql:
    name: sql invariants (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # NOT a `services:` block. run.sh starts and drives its own container over `docker exec` and
      # never speaks TCP to Postgres, so an Actions service container would be started, ignored,
      # and the suite would spin up its own anyway. What this job needs is a Docker daemon, which
      # GitHub's Ubuntu runners already have. It needs no secret and no DATABASE_URL.
      - name: pre-pull postgres
        run: docker pull postgres:16

      # The script directly rather than `pnpm test:sql`: it needs neither Node nor pnpm, and the
      # npm script is a one-line wrapper. This keeps a 4-second suite from waiting on an install.
      - name: schema, RLS and lifecycle invariants
        run: sh apps/server/test/sql/run.sh

      - name: remove the container
        if: always()
        run: docker rm -f jackioh-pg-test || true

  # The production `Store` against a real Postgres. Separate from `checks` for the same reason `sql`
  # is: `pnpm test` stays hermetic and needs no Docker, and the half of this contract that CAN run
  # hermetically already runs there — `contract.ts` is one suite executed against two stores, the
  # in-memory one in `pnpm test` and this one here. That pair is the check whose absence let
  # `src/db/store.ts` not exist at all while 233 server tests passed against a fake nothing compared
  # it to.
  db:
    name: store contract (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Like the `sql` job, no `services:` block: run.sh starts and drives its own container, applies
      # the Supabase stub, runs the real src/db/migrate.ts over the four migrations, applies the
      # grants and then runs vitest. Its exit status is the gate.
      - name: pre-pull postgres
        run: docker pull postgres:16

      - name: the store contract and the database-only tests
        run: pnpm test:db

      # run.sh removes it on exit already; this is the belt-and-braces path for a killed job. The
      # name is the one the script uses — checked, not guessed.
      - name: remove the container
        if: always()
        run: docker rm -f jackioh-pg-store-test || true

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One job per browser, so M8's "Chrome and Electron" is two independent results rather than one
    # run that happened to pick a browser. A failure in one does not mask the other.
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, electron]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: build the client
        # A built client rather than `vite dev`: HMR reloads the page mid-run when anything under
        # apps/web/src changes, which remounts the route and restarts the game at turn 0.
        #
        # `build:e2e`, not `build`: BUILD M5-T3 publishes `window.__jackioh` only when
        # `import.meta.env.MODE !== "production"`, and every one of the twelve specs reaches it
        # through cy.jackioh(). Under a plain `vite build` the handle is absent, /dev/hotseat
        # serves NotFound, and all twelve fail on their first command. Measured, not assumed:
        # 0 occurrences of `__jackioh` in a production bundle, 7 in this one.
        run: pnpm build:e2e

      # Both servers are backgrounded with their stdout redirected to a file. Without the
      # redirect the step inherits the runner's output pipe and can sit waiting for a child that
      # never closes it; with it, the logs also become uploadable evidence when the suite fails.
      - name: start the client
        run: |
          nohup pnpm --dir apps/web exec vite preview --port 5173 --strictPort \
            > "$RUNNER_TEMP/client.log" 2>&1 &
      - name: start the server
        env:
          E2E: "1"
        run: |
          nohup pnpm --dir apps/server start > "$RUNNER_TEMP/server.log" 2>&1 &

      - name: wait for both to answer
        run: |
          # /api/catalog is the one route R163 makes unauthenticated, so it is the honest
          # readiness probe: no token, and a 200 means the catalog really did register.
          # curl rather than `npx wait-on`, so readiness does not depend on a registry fetch
          # succeeding first — one less thing between a red run and its real cause.
          #
          # `localhost`, not `127.0.0.1`: `vite preview` binds the IPv6 loopback only. Measured on
          # the dev machine — [::1]:5173 and localhost:5173 answer 200, 127.0.0.1:5173 refuses the
          # connection outright — so a v4-literal probe would burn its whole budget with both
          # servers perfectly healthy. Whether a Linux runner binds v4, v6 or both is its resolver's
          # business, so the fix is to stop asserting a family: `localhost` is also exactly what
          # `baseUrl` in e2e/cypress.config.ts asks the browser for, which makes this probe a test
          # of the URL the suite actually uses rather than a near neighbour of it.
          for url in http://localhost:5173 http://localhost:8787/api/catalog; do
            for i in $(seq 1 120); do
              # -fs, not -fsS: a connection refused is the expected state while a server boots,
              # and 120 of them printed to stderr would bury the one message that matters.
              if curl -fs -o /dev/null "$url"; then echo "up: $url (${i}s)"; break; fi
              if [ "$i" -eq 120 ]; then
                echo "never answered: $url"
                echo "--- client.log ---"; cat "$RUNNER_TEMP/client.log" || true
                echo "--- server.log ---"; cat "$RUNNER_TEMP/server.log" || true
                exit 1
              fi
              sleep 1
            done
          done

      - name: the e2e specs
        env:
          E2E: "1"
        run: pnpm --dir e2e exec cypress run --browser ${{ matrix.browser }}

      # BUILD M5-T1's "without layout overflow at 1280x720 and 390x844", which nothing measured
      # until now: jsdom has no layout engine, and the 10-unit/10-backrow fixture the acceptance
      # names cannot be played into existence from an e2e spec (no deck fixture holds more than one
      # settable backrow card). Cypress component testing mounts that fixture in a real browser.
      #
      # Chrome only: the matrix would otherwise run it twice for one measurement, and Cypress 16
      # deprecates Electron. It needs no client build, no server and no E2E=1 — the component dev
      # server compiles apps/web/src itself, on port 5273 so it cannot collide with the preview.
      - name: the fixture board's layout, measured in a browser
        if: matrix.browser == 'chrome'
        run: pnpm --dir e2e exec cypress run --component --browser chrome

      - name: keep the evidence when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-${{ matrix.browser }}
          # e2e/artifacts/*, not e2e/cypress/*: e2e/cypress.config.ts puts screenshots under
          # `artifacts/screenshots`, resolved against the config's own directory. The cypress/
          # paths do not exist, so the upload collected nothing — and `if-no-files-found: ignore`
          # made that silent, which is the worst way to fail: a red run with no evidence attached.
          # `warn` instead, because a red run that produced no screenshot is itself a finding
          # (`screenshotOnRunFailure` is on, so one should always be there).
          path: |
            e2e/artifacts/screenshots
            e2e/artifacts/component/screenshots
            ${{ runner.temp }}/client.log
            ${{ runner.temp }}/server.log
          if-no-files-found: warn
